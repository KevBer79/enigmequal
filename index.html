<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Game - Hygiène</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bloc des consignes -->
    <div id="consignes-container">
        <h2>Bienvenue dans l’Escape Game Hygiène !</h2>
        <p>Répondez correctement aux questions pour avancer.</p>
        <button onclick="demarrerQuestionnaire()">Démarrer</button>
    </div>

    <!-- Bloc du questionnaire -->
    <div id="questionnaire" style="display:none;">
        <div id="question-text"></div>
        <div id="options-container"></div>
        <button id="next-button" style="display:none;">Suivant</button>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
